# Reusable OntoStart build: plan -> build each ontology folder -> publish.
#
# Called from a collection repository's .github/workflows/ontostart.yml:
#
#   permissions:
#     contents: write
#   concurrency:
#     group: ontostart-${{ github.ref }}
#     cancel-in-progress: false
#   jobs:
#     ontostart:
#       uses: micheldumontier/ontostart/.github/workflows/build.yml@v1
#
# Every inputs.* and github.event.* value reaches the shell only
# through env:, never inline in run:.
#
# Commits. Runs on one ref are serialised by the caller's concurrency group. The
# plan job checks out the ref's tip (push, workflow_dispatch) or github.sha
# (pull_request) and passes that exact commit to build and publish, so every job
# of a run sees the same tree, and a run queued behind another builds on top of
# that run's bump commit instead of bumping the same version again. The plan
# diffs only this event's commits (before..github.sha). Publish commits the
# version bumps on that commit; if the ref has moved it rebases onto it, and if
# a newer push changed the same files it fails without touching gh-pages: the
# newer push's own run rebuilds them. GitHub keeps one pending run per
# concurrency group: if three or more pushes land on one ref while a run is in
# progress, the middle pending run is cancelled, and its folders are rebuilt only
# on their next change or a manual run.
#
# gh-pages. Runs on different refs (main, sandbox/<name>) publish into the one
# gh-pages branch at the same time. Each publish fetches gh-pages, copies its
# ontologies in, regenerates the catalogue and pushes, and starts over from the
# fetch (up to 5 attempts) when another run pushed first.
#
# Secrets. GIST_TOKEN (badges) and W3ID_TOKEN (w3id-pr.yml) must be secrets of
# the environment "ontostart-secrets" whose deployment branches are limited to
# main, not repository secrets: anyone who can push a branch can run a modified
# workflow on it and read repository secrets. Set it up under Settings >
# Environments > New environment "ontostart-secrets" > Deployment branches and
# tags > Selected branches and tags > add "main"; add both secrets there and
# delete the repository-level copies. Only the badges job (main only) and
# w3id-pr.yml use that environment.
name: ontostart build

on:
  workflow_call:
    inputs:
      engine-ref:
        description: >-
          Engine version: a ref of micheldumontier/ontostart to pip install,
          or "" to pip install the checked-out repository itself.
        type: string
        required: false
        default: v1
      only:
        description: Build only this path (e.g. "pizza" or "sandbox/testo").
        type: string
        required: false
        default: ""
      bump:
        description: '"" lets the plan decide; "true" or "false" overrides.'
        type: string
        required: false
        default: ""
    secrets:
      GIST_TOKEN:
        description: >-
          Token allowed to update the badge gist (optional). Define it as a secret
          of the ontostart-secrets environment (see above); the badges job reads it
          from there.
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ENGINE_REF: ${{ inputs.engine-ref }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      has-targets: ${{ steps.plan.outputs.has-targets }}
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ref's tip (it may already hold an earlier run's bump commit); the PR merge commit for PRs.
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}

      # build and publish check out exactly this commit.
      - name: Record the commit
        id: sha
        run: |
          sha="$(git rev-parse HEAD)"
          echo "Building $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the engine
        run: |
          python -m pip install --upgrade pip
          if [ -z "$ENGINE_REF" ]; then
            pip install .
          else
            pip install "git+https://github.com/micheldumontier/ontostart@${ENGINE_REF}"
          fi

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_SHA: ${{ github.sha }}
          ONLY: ${{ inputs.only }}
          BUMP: ${{ inputs.bump }}
        run: |
          case "$EVENT" in
            push) base="$PUSH_BEFORE" ;;
            pull_request) base="$PR_BASE" ;;
            *) base="" ;;
          esac
          args=(--ref "$REF" --event "$EVENT")
          changed="$RUNNER_TEMP/changed.txt"
          # Diff only this event's commits (base..github.sha): HEAD may be a newer tip that
          # holds an earlier run's bump commit, which must not be planned again.
          if [ -n "$base" ] && ! [[ "$base" =~ ^0+$ ]]; then
            if git fetch --no-tags --depth=1 origin "$base" "$EVENT_SHA" \
                && git diff --name-only "$base" "$EVENT_SHA" > "$changed"; then
              echo "Changed files ($base..$EVENT_SHA):"
              cat "$changed"
              args+=(--changed-file "$changed")
            else
              echo "::warning::could not diff $base..$EVENT_SHA; planning every ontology"
            fi
          fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -n "$BUMP" ]; then args+=(--bump "$BUMP"); fi
          plan="$(ontostart plan "${args[@]}")"
          echo "$plan" | jq .
          {
            echo "plan=$plan"
            echo "has-targets=$(jq -r '(.targets | length) > 0' <<<"$plan")"
            echo "publish=$(jq -r '.publish' <<<"$plan")"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.has-targets == 'true'
    name: build ${{ matrix.target.path }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.plan).targets }}
    env:
      TARGET_JSON: ${{ toJSON(matrix.target) }}
      PLAN_BUMP: ${{ fromJSON(needs.plan.outputs.plan).bump }}
      PLAN_FOOPS: ${{ fromJSON(needs.plan.outputs.plan).foops }}
      GIST_ID: ${{ fromJSON(needs.plan.outputs.plan).gist_id }}
      GIST_OWNER: ${{ vars.GIST_OWNER || github.repository_owner }}
      REPO: ${{ github.repository }}
      REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      SERVER_URL: ${{ github.server_url }}
      ONTO_NAME: ${{ matrix.target.name }}
      ONTO_PATH: ${{ matrix.target.path }}
      ONTO_FOLDER: ${{ matrix.target.folder }}
      ONTO_FILE: ${{ matrix.target.file }}
      ONTO_IRI: ${{ matrix.target.base_iri }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Java (for ROBOT/HermiT)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the engine
        run: |
          python -m pip install --upgrade pip
          if [ -z "$ENGINE_REF" ]; then
            pip install .
          else
            pip install "git+https://github.com/micheldumontier/ontostart@${ENGINE_REF}"
          fi
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Download ROBOT (checksum-verified)
        run: |
          mkdir -p "$RUNNER_TEMP/robot"
          cd "$RUNNER_TEMP/robot"
          curl -fsSL -o robot.jar https://github.com/ontodev/robot/releases/download/v1.9.8/robot.jar
          echo "6f518b0293d8146d8a5a168c53607a952effb66bcaf3c6539996d7ec5c5f05f8  robot.jar" | sha256sum -c -

      - name: Check (OWL DL profile, HermiT reasoning)
        id: check
        run: |
          # ROBOT writes its working files next to the report; keep them out of the artifact.
          work="$RUNNER_TEMP/check"
          mkdir -p "$OUT/logs" "$work"
          ontostart check --target-json "$TARGET_JSON" --robot "$RUNNER_TEMP/robot/robot.jar" --out "$work/report.json"
          cp "$work/report.json" "$OUT/"
          if [ -f "$work/reason.explanation.md" ]; then cp "$work/reason.explanation.md" "$OUT/"; fi
          cat "$OUT/report.json"
          # Each ROBOT run's output, with workflow commands disabled while it prints.
          stop="robot-log-$RANDOM$RANDOM"
          jq -r '(.logs // {}) | to_entries[] | [.key, .value] | @tsv' "$OUT/report.json" |
          while IFS=$'\t' read -r step log; do
            echo "::group::ROBOT $step output"
            echo "::stop-commands::$stop"
            cat "$log"
            echo    # the end token must start a line even if the log does not end with one
            echo "::$stop::"
            echo "::endgroup::"
            cp "$log" "$OUT/logs/"
          done
          reason="$(ontostart blocked --report "$OUT/report.json")"
          if [ -n "$reason" ]; then
            echo "::error::$ONTO_PATH is blocked: $reason"
            {
              echo "### $ONTO_PATH is blocked"
              echo
              echo "$reason"
              if [ -f "$OUT/reason.explanation.md" ]; then
                echo
                cat "$OUT/reason.explanation.md"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        id: version
        env:
          BLOCKED: ${{ steps.check.outputs.blocked }}
        run: |
          if [ "$PLAN_BUMP" = true ] && [ "$BLOCKED" = false ]; then
            v="$(ontostart version --target-json "$TARGET_JSON" --bump)"
          elif ! v="$(ontostart version --target-json "$TARGET_JSON")"; then
            if [ "$BLOCKED" = true ]; then
              v=""
            else
              exit 1
            fi
          fi
          echo "Version: ${v:-none}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Syntax variants
        if: steps.check.outputs.blocked == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ontostart variants --target-json "$TARGET_JSON" --version "$VERSION"

      - name: Check out OntoSpy (fork)
        id: ontospy-checkout
        if: steps.check.outputs.blocked == 'false'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: micheldumontier/Ontospy
          path: .ontospy-src
          persist-credentials: false

      - name: Install OntoSpy and pyLODE
        if: steps.check.outputs.blocked == 'false'
        continue-on-error: true
        run: |
          pip install "git+https://github.com/RDFLib/pyLODE.git@3.1.0"
          cd .ontospy-src
          pip install -r requirements.txt
          pip install -e .

      - name: OntoSpy docs
        id: ontospy
        if: steps.check.outputs.blocked == 'false'
        continue-on-error: true
        run: |
          mkdir -p "$OUT/site/docs/ontospy"
          python -m ontospy.cli gendocs --type 2 -o "$OUT/site/docs/ontospy" "$ONTO_FILE"

      - name: pyLODE docs
        id: pylode
        if: steps.check.outputs.blocked == 'false'
        continue-on-error: true
        run: |
          mkdir -p "$OUT/site/docs/pylode"
          python - "$ONTO_FILE" "$OUT/site/docs/pylode/index.html" <<'PY'
          import sys
          from pylode import OntPub
          OntPub(sys.argv[1]).make_html(destination=sys.argv[2])
          PY

      - name: FOOPS! assessment
        id: foops
        if: steps.check.outputs.blocked == 'false' && env.PLAN_FOOPS == 'true'
        continue-on-error: true
        run: |
          body="$(jq -cn --arg iri "$ONTO_IRI" '{ontologyUri: $iri}')"
          curl -fsS --max-time 120 -X POST "https://foops.linkeddata.es/assessOntology" \
            -H 'accept: application/json' -H 'Content-Type: application/json' \
            -d "$body" -o "$RUNNER_TEMP/foops.json"

      - name: Site
        if: steps.check.outputs.blocked == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ONTOSPY_OK: ${{ steps.ontospy.outcome == 'success' }}
          PYLODE_OK: ${{ steps.pylode.outcome == 'success' }}
        run: |
          args=(--target-json "$TARGET_JSON" --version "$VERSION" --out "$OUT/site"
                --report "$OUT/report.json" --result "$OUT/result.json"
                --repo "$REPO" --ref "$REF" --server-url "$SERVER_URL"
                --step "ontospy=$ONTOSPY_OK" --step "pylode=$PYLODE_OK")
          if [ "$PLAN_FOOPS" = true ]; then args+=(--foops-json "$RUNNER_TEMP/foops.json"); fi
          if [ -n "$GIST_ID" ]; then
            args+=(--badge-base "https://img.shields.io/endpoint?url=https://gist.githubusercontent.com/$GIST_OWNER/$GIST_ID/raw/")
          fi
          ontostart site "${args[@]}"

      - name: Result only (blocked)
        if: steps.check.outputs.blocked == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ontostart site --result-only --target-json "$TARGET_JSON" --version "$VERSION" \
            --report "$OUT/report.json" --result "$OUT/result.json" \
            --repo "$REPO" --ref "$REF" --server-url "$SERVER_URL"

      - name: Stage bumped source
        if: steps.check.outputs.blocked == 'false' && env.PLAN_BUMP == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$OUT/source/$ONTO_FOLDER/versions"
          cp "$ONTO_FILE" "$OUT/source/$ONTO_FOLDER/"
          cp -R "$ONTO_FOLDER/versions/$VERSION" "$OUT/source/$ONTO_FOLDER/versions/"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ontology-${{ matrix.target.safe }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

      - name: Fail if blocked
        if: steps.check.outputs.blocked == 'true'
        run: |
          echo "::error::$ONTO_PATH: $(ontostart blocked --report "$OUT/report.json")"
          exit 1

  publish:
    needs: [plan, build]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && needs.plan.outputs.publish == 'true'
      && needs.plan.outputs.has-targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sorted: ${{ steps.sort.outputs.sorted }}
      deployed: ${{ steps.pages.outputs.deployed }}
    env:
      PLAN: ${{ needs.plan.outputs.plan }}
      PLAN_SHA: ${{ needs.plan.outputs.sha }}
      REF: ${{ github.ref_name }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the plan and the builds used; the bumps are committed on it.
          ref: ${{ needs.plan.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the engine
        run: |
          python -m pip install --upgrade pip
          if [ -z "$ENGINE_REF" ]; then
            pip install .
          else
            pip install "git+https://github.com/micheldumontier/ontostart@${ENGINE_REF}"
          fi
          echo "ARTIFACTS=$RUNNER_TEMP/artifacts" >> "$GITHUB_ENV"

      - name: Download build results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ontology-*
          path: ${{ runner.temp }}/artifacts

      # ready.txt: "<safe> <path> <folder> <name> <version>" of targets to publish.
      # blocked.txt: "<path>: <reason>" of targets that are not published.
      - name: Sort targets
        id: sort
        run: |
          : > "$RUNNER_TEMP/ready.txt"
          : > "$RUNNER_TEMP/blocked.txt"
          jq -r '.targets[] | [.safe, .path, .folder, .name] | @tsv' <<<"$PLAN" |
          while IFS=$'\t' read -r safe path folder name; do
            dir="$ARTIFACTS/ontology-$safe"
            if [ ! -f "$dir/report.json" ] || [ ! -f "$dir/result.json" ]; then
              echo "$path: build failed" >> "$RUNNER_TEMP/blocked.txt"
              continue
            fi
            reason="$(ontostart blocked --report "$dir/report.json")"
            if [ -n "$reason" ]; then
              echo "$path: $reason" >> "$RUNNER_TEMP/blocked.txt"
            elif [ ! -d "$dir/site" ]; then
              echo "$path: build failed (no site)" >> "$RUNNER_TEMP/blocked.txt"
            else
              echo "$safe $path $folder $name $(jq -r .version "$dir/result.json")" >> "$RUNNER_TEMP/ready.txt"
            fi
          done
          echo "Ready:"; cat "$RUNNER_TEMP/ready.txt"
          echo "Blocked:"; cat "$RUNNER_TEMP/blocked.txt"
          echo "sorted=true" >> "$GITHUB_OUTPUT"

      - name: Commit version bumps
        run: |
          if [ "$(jq -r .bump <<<"$PLAN")" != true ]; then
            echo "No bump in this run."
            exit 0
          fi
          parts=()
          while read -r safe path folder name version; do
            src="$ARTIFACTS/ontology-$safe/source"
            [ -d "$src" ] || continue
            cp -R "$src/." "$GITHUB_WORKSPACE/"
            git add -- "$folder/$name.ttl" "$folder/versions/$version"
            parts+=("$path@$version")
          done < "$RUNNER_TEMP/ready.txt"
          if [ "${#parts[@]}" -eq 0 ] || git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          joined="$(printf '%s, ' "${parts[@]}")"
          git commit -m "chore(ontology): bump ${joined%, } [skip ci]"
          if git push origin "HEAD:refs/heads/$REF"; then
            exit 0
          fi
          echo "$REF has moved since $PLAN_SHA; rebasing the bump commit onto it."
          if ! git pull --rebase origin "$REF"; then
            conflicts="$(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            git rebase --abort || true
            if [ -n "$conflicts" ]; then
              echo "::error::a newer push changed ${conflicts% }; not publishing. The queued run will rebuild."
            else
              echo "::error::could not rebase the bump commit onto $REF; not publishing."
            fi
            exit 1
          fi
          git push origin "HEAD:refs/heads/$REF"

      # Other refs publish into gh-pages at the same time: on a rejected push, start
      # over from a fresh fetch of gh-pages (up to 5 attempts).
      - name: Publish to gh-pages
        id: pages
        run: |
          if [ ! -s "$RUNNER_TEMP/ready.txt" ]; then
            echo "Nothing to publish."
            echo "deployed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          parts=()
          deployed=()
          while read -r safe path _ _ version; do
            parts+=("$path@$version")
            deployed+=("$safe")
          done < "$RUNNER_TEMP/ready.txt"
          joined="$(printf '%s, ' "${parts[@]}")"
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
              git fetch --no-tags --depth=1 origin "+refs/heads/gh-pages:refs/remotes/origin/gh-pages"
              if [ -d gh-pages ]; then
                git -C gh-pages reset -q --hard origin/gh-pages
                git -C gh-pages clean -q -ffdx
              else
                git worktree add -B gh-pages gh-pages origin/gh-pages
              fi
            else
              if [ -d gh-pages ]; then
                git worktree remove --force gh-pages
                git branch -D gh-pages
              fi
              git worktree add --orphan -b gh-pages gh-pages
            fi
            while read -r safe path _ _ _; do
              # Keep the published OntoSpy/pyLODE docs when this build could not regenerate them.
              keep=()
              for doc in ontospy pylode; do
                if [ "$(jq -r --arg d "$doc" '.steps[$d]' "$ARTIFACTS/ontology-$safe/result.json")" = false ]; then
                  keep+=("--exclude=/docs/$doc/")
                fi
              done
              mkdir -p "gh-pages/$path"
              # --checksum: a file of the same size checked out in the same second as the
              # artifact was downloaded (e.g. 1.0.4 -> 1.0.5) would otherwise be skipped.
              rsync -a --checksum --delete "${keep[@]}" "$ARTIFACTS/ontology-$safe/site/" "gh-pages/$path/"
            done < "$RUNNER_TEMP/ready.txt"
            ontostart catalogue --site gh-pages
            touch gh-pages/.nojekyll
            git -C gh-pages add -A
            if git -C gh-pages diff --cached --quiet; then
              echo "gh-pages is up to date."
              pushed=true
              break
            fi
            git -C gh-pages commit -q -m "chore(pages): publish ${joined%, } [skip ci]"
            if git -C gh-pages push origin gh-pages; then
              pushed=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "::warning::gh-pages push rejected (attempt $attempt of 5); retrying from a fresh fetch."
              sleep $((attempt * 3))
            fi
          done
          if [ "$pushed" != true ]; then
            echo "::error::could not push gh-pages after 5 attempts."
            exit 1
          fi
          echo "deployed=${deployed[*]}" >> "$GITHUB_OUTPUT"

      - name: Report blocked ontologies
        if: ${{ !cancelled() && steps.sort.outcome == 'success' }}
        run: |
          if [ ! -s "$RUNNER_TEMP/blocked.txt" ]; then
            exit 0
          fi
          {
            echo "### Not published"
            sed 's/^/- /' "$RUNNER_TEMP/blocked.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r line; do echo "::error::$line"; done < "$RUNNER_TEMP/blocked.txt"
          exit 1

  # Badges are pushed from main only, in the one job that can read GIST_TOKEN:
  # the ontostart-secrets environment is limited to main (see the header).
  badges:
    needs: [plan, publish]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.publish.outputs.sorted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ontostart-secrets
    env:
      PLAN: ${{ needs.plan.outputs.plan }}
      DEPLOYED_SAFES: ${{ needs.publish.outputs.deployed }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the engine
        run: |
          python -m pip install --upgrade pip
          if [ -z "$ENGINE_REF" ]; then
            pip install .
          else
            pip install "git+https://github.com/micheldumontier/ontostart@${ENGINE_REF}"
          fi

      - name: Download build results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ontology-*
          path: ${{ runner.temp }}/artifacts

      # DEPLOYED_SAFES lists the targets this run pushed to gh-pages; the others get a red deploy badge.
      - name: Badges
        continue-on-error: true
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          read -ra safes <<<"$DEPLOYED_SAFES"
          ontostart badges --results "$RUNNER_TEMP/artifacts" --gist "$(jq -r '.gist_id // empty' <<<"$PLAN")" --deployed "${safes[@]}"
