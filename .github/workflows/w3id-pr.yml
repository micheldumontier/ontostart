name: Propose w3id.org redirects

on:
  workflow_dispatch:
    inputs:
      W3ID_FOLDER:
        description: "Identifier: the w3id.org directory ids/<name>, serving https://w3id.org/<name>/ (e.g., 'ontostart')"
        required: true
        default: "ontostart"
      SOURCE_HTACCESS_PATH:
        description: "Path in this repo to the .htaccess to copy"
        required: true
        default: "apache/web/ontostart/.htaccess"
      SOURCE_README_PATH:
        description: "Path in this repo to the README.md file to copy"
        required: true
        default: "apache/web/ontostart/README.md"        
      W3ID_FORK_OWNER:
        description: "Organization to own the fork (leave empty to fork under your user)"
        required: false
        default: ""
      COMMIT_MESSAGE:
        description: "Git commit message for the .htaccess/README change"
        required: false
        default: ""
      PR_TITLE:
        description: "Pull request title"
        required: false
        default: ""
      PR_BODY:
        description: "Pull request body / description"
        required: false
        default: ""

  # The same inputs, for collection repositories that call this workflow.
  workflow_call:
    inputs:
      W3ID_FOLDER:
        description: "Identifier: the w3id.org directory ids/<name>, serving https://w3id.org/<name>/"
        type: string
        required: true
      SOURCE_HTACCESS_PATH:
        description: "Path in the calling repository to the .htaccess to copy"
        type: string
        required: true
      SOURCE_README_PATH:
        description: "Path in the calling repository to the README.md file to copy"
        type: string
        required: true
      W3ID_FORK_OWNER:
        description: "Organization to own the fork (leave empty to fork under your user)"
        type: string
        required: false
        default: ""
      COMMIT_MESSAGE:
        description: "Git commit message for the .htaccess/README change"
        type: string
        required: false
        default: ""
      PR_TITLE:
        description: "Pull request title"
        type: string
        required: false
        default: ""
      PR_BODY:
        description: "Pull request body / description"
        type: string
        required: false
        default: ""
      engine-ref:
        description: >-
          Engine version: a ref of micheldumontier/ontostart to pip install,
          or "" to pip install the checked-out repository itself.
        type: string
        required: false
        default: v1
    secrets:
      W3ID_TOKEN:
        description: Token that can fork perma-id/w3id.org and open pull requests there.
        required: true

permissions:
  contents: write
  pull-requests: write

env:
  W3ID_UPSTREAM_REPO: perma-id/w3id.org
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Run by hand in this repository there is no engine-ref input, so the engine
  # is installed from this checkout ("").
  ENGINE_REF: ${{ inputs.engine-ref }}

jobs:
  make-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gh is preinstalled on ubuntu-latest, but this keeps the job portable
      - name: Ensure GitHub CLI is available
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y gh
          fi
          gh --version

      - name: Authenticate gh for API and Git
        env:
          W3ID_TOKEN: ${{ secrets.W3ID_TOKEN }}
        run: |
          echo "$W3ID_TOKEN" | gh auth login --with-token
          gh auth status
          gh auth setup-git
          git config --global user.name  "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Capture inputs
        env:
          IN_W3ID_FOLDER: ${{ inputs.W3ID_FOLDER }}
          IN_SOURCE_HTACCESS_PATH: ${{ inputs.SOURCE_HTACCESS_PATH }}
          IN_SOURCE_README_PATH: ${{ inputs.SOURCE_README_PATH }}
          IN_W3ID_FORK_OWNER: ${{ inputs.W3ID_FORK_OWNER }}
        run: |
          {
            echo "W3ID_FOLDER=${IN_W3ID_FOLDER}"
            echo "SOURCE_HTACCESS_PATH=${IN_SOURCE_HTACCESS_PATH}"
            echo "SOURCE_README_PATH=${IN_SOURCE_README_PATH}"
            echo "REQ_OWNER=${IN_W3ID_FORK_OWNER}"
          } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # The committed .htaccess must be exactly what the engine generates from ontostart.yaml.
      - name: Check the .htaccess is up to date
        run: |
          python -m pip install --upgrade pip
          if [ -z "$ENGINE_REF" ]; then
            pip install .
          else
            pip install "git+https://github.com/micheldumontier/ontostart@${ENGINE_REF}"
          fi
          ontostart htaccess --out "$RUNNER_TEMP/htaccess"
          if ! diff -u "$RUNNER_TEMP/htaccess" "$SOURCE_HTACCESS_PATH"; then
            echo "::error::$SOURCE_HTACCESS_PATH differs from \`ontostart htaccess\`; regenerate and commit it."
            exit 1
          fi

      # Runs the .htaccess in Apache and checks it against the expected redirects
      # before proposing it to w3id.org.
      - name: Test redirects
        run: |
          if [ -f apache/test-redirects.sh ] && [ -f apache/tests/redirects.tsv ]; then
            bash apache/test-redirects.sh --htaccess "$SOURCE_HTACCESS_PATH" --folder "$W3ID_FOLDER"
          else
            echo "::warning::apache/test-redirects.sh or apache/tests/redirects.tsv not found; skipping redirect tests."
          fi

      - name: Determine upstream default branch
        run: |
          BASE_BRANCH="$(gh api repos/${{ env.W3ID_UPSTREAM_REPO }} -q .default_branch)"
          echo "BASE_BRANCH=${BASE_BRANCH}" | tee -a "$GITHUB_ENV"

      - name: Decide fork target (org vs user)
        run: |
          FORK_OWNER="${GITHUB_ACTOR}"
          TARGET_IS_ORG="false"
          if [ -n "${REQ_OWNER}" ]; then
            TYPE="$(gh api "users/${REQ_OWNER}" -q .type || echo unknown)"
            if [ "${TYPE}" = "Organization" ]; then
              FORK_OWNER="${REQ_OWNER}"
              TARGET_IS_ORG="true"
              echo "Fork will be created under org '${FORK_OWNER}'."
            else
              echo "Input '${REQ_OWNER}' is not an Organization (type=${TYPE}); forking under user '${GITHUB_ACTOR}'."
            fi
          else
            echo "No org provided; forking under user '${GITHUB_ACTOR}'."
          fi
          echo "FORK_OWNER=${FORK_OWNER}"       >> "$GITHUB_ENV"
          echo "TARGET_IS_ORG=${TARGET_IS_ORG}" >> "$GITHUB_ENV"

      - name: Fork upstream (idempotent)
        run: |
          if [ "${TARGET_IS_ORG}" = "true" ]; then
            gh repo fork "${{ env.W3ID_UPSTREAM_REPO }}" --org "${FORK_OWNER}" --remote=false || true
          else
            gh repo fork "${{ env.W3ID_UPSTREAM_REPO }}" --remote=false || true
          fi

      - name: Compute fork fullname and clone
        run: |
          FORK_FULLNAME="${FORK_OWNER}/$(basename '${{ env.W3ID_UPSTREAM_REPO }}')"
          echo "FORK_FULLNAME=${FORK_FULLNAME}" >> "$GITHUB_ENV"

          # Wait for fork to exist (first run) then clone
          for i in {1..10}; do
            if git ls-remote "https://github.com/${FORK_FULLNAME}.git" &>/dev/null; then
              break
            fi
            echo "Waiting for fork to be ready (${i}/10)..."
            sleep 3
          done

          git clone "https://github.com/${FORK_FULLNAME}.git"
          echo "CLONED_DIR=$(basename '${{ env.W3ID_UPSTREAM_REPO }}')" >> "$GITHUB_ENV"

          # Branch from upstream, not from the fork's default branch, which may be stale
          cd "$(basename '${{ env.W3ID_UPSTREAM_REPO }}')"
          git remote add upstream "https://github.com/${{ env.W3ID_UPSTREAM_REPO }}.git"
          git fetch upstream "${BASE_BRANCH}"

      - name: Create branch and copy .htaccess AND README.md
        env:
          IN_COMMIT_MESSAGE: ${{ inputs.COMMIT_MESSAGE }}
        run: |
          cd "${CLONED_DIR}"
          BRANCH="${W3ID_FOLDER}-$(date +%Y%m%d%H%M%S)"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          git checkout -b "${BRANCH}" "upstream/${BASE_BRANCH}"

          # w3id.org keeps every identifier under ids/
          ID_DIR="ids/${W3ID_FOLDER}"
          echo "ID_DIR=${ID_DIR}" >> "$GITHUB_ENV"
          mkdir -p "${ID_DIR}"
          if [ ! -f "${GITHUB_WORKSPACE}/${SOURCE_HTACCESS_PATH}" ]; then
            echo "Source ${SOURCE_HTACCESS_PATH} not found." >&2
            exit 1
          fi

          cp "${GITHUB_WORKSPACE}/${SOURCE_HTACCESS_PATH}" "${ID_DIR}/.htaccess"
          cp "${GITHUB_WORKSPACE}/${SOURCE_README_PATH}" "${ID_DIR}/README.md"

          git add "${ID_DIR}/.htaccess" "${ID_DIR}/README.md" || true

          COMMIT_MSG="${IN_COMMIT_MESSAGE}"
          if [ -z "${COMMIT_MSG}" ]; then
            COMMIT_MSG="${W3ID_FOLDER}: update redirects"
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "${COMMIT_MSG}"
          else
            echo "No changes to commit; proceeding without commit."
          fi

      # w3id.org's own checker (https://w3id.org/docs/rules/); errors block the PR
      - name: Run the w3id.org checker
        run: |
          cd "${CLONED_DIR}"
          (cd tools/check && npm ci --no-audit --no-fund)
          node tools/check/bin/w3id-check.js "${ID_DIR}"

      - name: Push branch to fork
        run: |
          cd "${CLONED_DIR}"
          git remote add fork "https://github.com/${FORK_FULLNAME}.git" || git remote set-url fork "https://github.com/${FORK_FULLNAME}.git"
          # Push even if there were no new commits (creates branch if needed)
          git push -u fork "${BRANCH}"

      - name: Open/Reuse Pull Request to upstream
        env:
          IN_PR_TITLE: ${{ inputs.PR_TITLE }}
          IN_PR_BODY: ${{ inputs.PR_BODY }}
        run: |
          set -e
          # Try to create the PR; if it already exists, just show it
          PR_TITLE="${IN_PR_TITLE}"
          if [ -z "${PR_TITLE}" ]; then
            PR_TITLE="${W3ID_FOLDER}: update redirects"
          fi
          PR_BODY="${IN_PR_BODY}"
          if [ -z "${PR_BODY}" ]; then
            PR_BODY="Updates \`${ID_DIR}/.htaccess\` (and README.md) with the redirects for https://w3id.org/${W3ID_FOLDER}/."
          fi
          if gh pr create \
              --repo "${{ env.W3ID_UPSTREAM_REPO }}" \
              --head "${FORK_OWNER}:${BRANCH}" \
              --base "${BASE_BRANCH}" \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}"; then
            echo "PR created."
          else
            echo "PR may already exist; showing matching PRs..."
          fi
          gh pr list --repo "${{ env.W3ID_UPSTREAM_REPO }}" --search "${BRANCH}" --state open --limit 1
          # Print the URL of the PR (new or existing)
          gh pr view --repo "${{ env.W3ID_UPSTREAM_REPO }}" --json url -q .url || true
