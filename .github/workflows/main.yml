name: ontology CI
on:
  push:
    branches:
      - main
    paths:
      - '*.ttl'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # === Per-branch overrides ===
    # Only these two values may differ across branches. Everything else is
    # canonical and kept identical with sibling branches' main.yml.
    env:
      ONTO_FILE: testo.ttl
      ONTO_ABBREV: testo
      # === Canonical (do not change per branch) ===
      VERSION_DIR: versions
      DOCS_DIR: docs
      GIST_ID: ${{ vars.GIST_ID }}

    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (for ROBOT/HermiT)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling (ROBOT, HermiT, Pylode, RDFLib)
        run: |
          python -m pip install --upgrade pip
          pip install rdflib dotenv "git+https://github.com/RDFLib/pyLODE.git@3.1.0"
          wget -q https://github.com/ontodev/robot/releases/download/v1.9.8/robot.jar -O robot.jar
          curl -sL https://raw.githubusercontent.com/ontodev/robot/master/bin/robot > robot
          chmod +x robot

      - name: Get Ontology IRI
        run: |
          python3 - << 'PY'
          import os
          from rdflib import Graph, Namespace, RDF
          g = Graph()
          g.parse(os.environ["ONTO_FILE"])
          OWL = Namespace("http://www.w3.org/2002/07/owl#")
          ontos = list(g.subjects(RDF.type, OWL.Ontology))
          iri = str(ontos[0]) if ontos else ""
          with open(os.environ["GITHUB_ENV"], "a") as f:
            f.write(f"ONTO_IRI={iri}\n")
          PY

      - name: Validate ontology profile
        id: profile
        run: |
          ./robot validate-profile --input "$ONTO_FILE" --profile DL || \
          (echo "Profile check failed." && exit 1)

      - name: Badge — Syntax
        if: always()
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ env.GIST_ID }}
          filename: ontology-ci-profile-main.json
          label: OWL DL Profile
          message: ${{ steps.profile.outcome }}
          color: ${{ steps.profile.outcome == 'success' && 'brightgreen' || steps.profile.outcome == 'cancelled' && 'yellow' || 'red' }}

      - name: Reasoning and consistency check (HermiT)
        id: reason
        run: |
          # Outcome: consistent | N unsatisfiable | inconsistent.
          # When not consistent, ROBOT explains why in reason.explanation.md.
          if ./robot reason --reasoner HermiT --input "$ONTO_FILE" --output reasoned.owl \
               > reason.stdout 2> reason.stderr; then
            RESULT="consistent"; COLOR="brightgreen"
          elif grep -q "ontology is inconsistent" reason.stdout reason.stderr; then
            RESULT="inconsistent"; COLOR="red"
            ./robot explain --reasoner HermiT --input "$ONTO_FILE" --mode inconsistency \
              --explanation reason.explanation.md >> reason.stdout 2>> reason.stderr || true
          elif N=$(grep -ohE "There are [0-9]+ unsatisfiable classes|There is 1 unsatisfiable class" reason.stdout reason.stderr | grep -oE "[0-9]+" | head -1); [ -n "$N" ]; then
            RESULT="$N unsatisfiable"; COLOR="orange"
            ./robot explain --reasoner HermiT --input "$ONTO_FILE" --mode unsatisfiability --unsatisfiable all \
              --explanation reason.explanation.md >> reason.stdout 2>> reason.stderr || true
          else
            RESULT="error"; COLOR="red"
          fi
          echo "REASON_RESULT=$RESULT" >> "$GITHUB_ENV"
          echo "REASON_COLOR=$COLOR" >> "$GITHUB_ENV"
          echo "Reasoning: $RESULT"
          cat reason.stdout reason.stderr
          if [ -f reason.explanation.md ]; then
            echo "::group::Explanation"; cat reason.explanation.md; echo "::endgroup::"
            { echo "## Reasoning: $RESULT"; echo; cat reason.explanation.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reasoning logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-logs
          path: |
            reason.stdout
            reason.stderr
            reason.summary
            reason.explanation.md

      - name: Badge — Reason
        if: always()
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ env.GIST_ID }}
          filename: ontology-ci-reason-main.json
          label: Reasoning
          message: ${{ env.REASON_RESULT }}
          color: ${{ env.REASON_COLOR || 'red' }}

      - name: Bump version (owl:versionInfo, owl:versionIRI, dcterms:modified, owl:priorVersion, owl:backwardsCompatibleWith)
        id: bump_version
        run: |
          python scripts/bump_version.py

      - name: Badge — Version update
        if: always()
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ env.GIST_ID }}
          filename: ontology-ci-version-main.json
          label: Version
          message: ${{ env.NEW_VERSION }}
          color: ${{ steps.bump_version.outcome == 'success' && 'brightgreen' || 'red' }}

      - name: Generate syntax variants
        id: syntax_variants
        run: |
          python3 - << 'PY'
          import os
          from rdflib import Graph
          target_dir = f"{os.environ['VERSION_DIR']}/{os.environ['NEW_VERSION']}"
          os.makedirs(target_dir, exist_ok=True)
          g = Graph()
          g.parse(os.environ["ONTO_FILE"])
          targets = [("ttl","turtle"), ("jsonld","json-ld"), ("nt","nt"), ("owl","xml")]
          files_to_commit = set()
          for ext, fmt in targets:
            out = f"{target_dir}/{os.environ['ONTO_ABBREV']}.{ext}"
            print(f"Creating {out}")
            g.serialize(destination=out, format=fmt, encoding="utf-8")
            files_to_commit.add(out)
          with open(os.environ["GITHUB_ENV"], "a") as f:
            f.write("NEW_FILES=" + " ".join(files_to_commit) + "\n")
          PY

      - name: Commit bumped ontology back to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $ONTO_FILE ${{ env.NEW_FILES }}
          git commit -m "chore(ontology): bump version to ${{ env.NEW_VERSION }} [skip ci]" || echo "Nothing to commit."
          git push

      - name: Checkout Forked Ontospy
        uses: actions/checkout@v4
        with:
          repository: micheldumontier/Ontospy
          path: './ontospy'

      - name: Install Forked Ontospy
        run: |
          python -m pip install --upgrade pip
          cd ./ontospy
          pip install -r requirements.txt
          pip install -e .
          cd ..

      - name: Generate documentation with Ontospy
        id: ontospy
        run: |
          mkdir -p "$DOCS_DIR/docs/ontospy"
          python -m ontospy.cli gendocs --type 2 -o "$DOCS_DIR/docs/ontospy" "$ONTO_FILE"

      - name: Badge — Ontospy
        if: always()
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ env.GIST_ID }}
          filename: ontology-ci-ontospy-main.json
          label: ontospy
          message: ${{ steps.ontospy.outcome }}
          color: ${{ steps.ontospy.outcome == 'success' && 'brightgreen' || steps.ontospy.outcome == 'cancelled' && 'yellow' || 'red' }}

      - name: Generate static site with Pylode
        id: pylode
        continue-on-error: true
        run: |
          mkdir -p "$DOCS_DIR/docs/pylode"
          python3 - << 'PY'
          import os
          from pylode import OntPub
          od = OntPub(os.environ["ONTO_FILE"])
          od.make_html(destination=f"{os.environ['DOCS_DIR']}/docs/pylode/index.html")
          print("Pylode HTML generated.")
          PY

      - name: Badge — Pylode
        if: always()
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ env.GIST_ID }}
          filename: ontology-ci-pylode-main.json
          label: pylode
          message: ${{ steps.pylode.outcome }}
          color: ${{ steps.pylode.outcome == 'success' && 'brightgreen' || steps.pylode.outcome == 'cancelled' && 'yellow' || 'red' }}

      - name: Export ONTO_IRI for downstream jobs
        id: vars
        run: |
          echo "onto_iri=${ONTO_IRI}" >> "$GITHUB_OUTPUT"

      - name: Copy versioned files to docs
        run: |
          mkdir -p "$DOCS_DIR/versions/latest"
          cp -r "$VERSION_DIR"/* "$DOCS_DIR/versions/"
          cp -r "$VERSION_DIR/$NEW_VERSION/"* "$DOCS_DIR/versions/latest/"

      - name: Generate per-version landing pages
        run: |
          python3 - << 'PY'
          import os, re

          docs_dir  = os.environ["DOCS_DIR"]
          abbrev    = os.environ["ONTO_ABBREV"]
          ver_dir   = os.environ["VERSION_DIR"]
          cur_ver   = os.environ.get("NEW_VERSION", "")

          def semver_key(v):
            m = re.match(r'^(\d+)\.(\d+)\.(\d+)$', v)
            return tuple(map(int, m.groups())) if m else (0, 0, 0)

          versions = sorted(
            [d for d in os.listdir(ver_dir) if os.path.isdir(os.path.join(ver_dir, d)) and d != "latest"],
            key=semver_key, reverse=True
          )

          exts = ["ttl", "jsonld", "nt", "owl"]

          for v in versions:
            out_dir = f"{docs_dir}/{v}"
            os.makedirs(out_dir, exist_ok=True)

            # copy format files so content negotiation can serve them
            for ext in exts:
              src = f"{ver_dir}/{v}/{abbrev}.{ext}"
              if os.path.exists(src):
                import shutil
                shutil.copy(src, f"{out_dir}/{abbrev}.{ext}")

            is_current = v == cur_ver
            current_tag = " <strong>(current)</strong>" if is_current else ""
            links = "\n".join(
              f'            <li><a href="{abbrev}.{ext}">{abbrev}.{ext}</a></li>'
              for ext in exts if os.path.exists(f"{ver_dir}/{v}/{abbrev}.{ext}")
            )
            other_versions = "\n".join(
              f'            <li><a href="../{ov}/">{ov}</a>{"  (current)" if ov == cur_ver else ""}</li>'
              for ov in versions if ov != v
            )

            html = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8"/>
            <meta name="viewport" content="width=device-width,initial-scale=1"/>
            <title>{abbrev} {v}</title>
            <style>
              body {{ font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; }}
              h1 {{ margin-bottom: .25rem; }}
              .meta {{ color: #555; margin-bottom: 1.5rem; }}
              a {{ color: #0b5fff; }}
              ul {{ margin: .25rem 0 .5rem 1.25rem; }}
              .card {{ border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem; max-width: 600px; margin-bottom: 1rem; }}
            </style>
          </head>
          <body>
            <h1>{abbrev} <code>{v}</code>{current_tag}</h1>
            <div class="meta"><a href="../">← back to {abbrev}</a></div>
            <div class="card">
              <h2>Downloads</h2>
              <ul>
          {links}
              </ul>
            </div>
            <div class="card">
              <h2>Other versions</h2>
              <ul>
          {other_versions}
              </ul>
            </div>
          </body>
          </html>"""

            with open(f"{out_dir}/index.html", "w", encoding="utf-8") as f:
              f.write(html)

          print(f"Generated landing pages for: {', '.join(versions)}")
          PY

      - name: Generate site page (index.html with metadata + badges)
        env:
          BRANCH: ${{ github.ref_name }}
          SAFE_BRANCH: main
          PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main/
          BADGE_BASE: https://img.shields.io/endpoint?url=https://gist.githubusercontent.com/${{ vars.GIST_OWNER != '' && vars.GIST_OWNER || github.repository_owner }}/${{ vars.GIST_ID }}/raw/
          FOOPS_REPORT: "false"
        run: |
          python3 - << 'PY'
          import os, html as h
          from urllib.parse import quote
          from rdflib import Graph, Namespace, URIRef, RDF, RDFS, Literal
          g = Graph()
          g.parse(os.environ["ONTO_FILE"])
          OWL = Namespace("http://www.w3.org/2002/07/owl#")
          DCT = Namespace("http://purl.org/dc/terms/")
          # Find the ontology node (owl:Ontology)
          ontos = list(g.subjects(RDF.type, OWL.Ontology))
          onto = ontos[0] if ontos else None
          label = str(next(g.objects(onto, RDFS.label), "")) if onto else ""
          version = os.environ.get("NEW_VERSION","")
          modified = str(next(g.objects(onto, DCT.modified), "")) if onto else ""
          iri = str(onto) if onto else ""

          # Description: dcterms:description, else rdfs:comment (English preferred)
          def text(prop):
            vals = list(g.objects(onto, prop)) if onto else []
            for v in vals:
              if getattr(v, "language", None) in ("en", None):
                return str(v).strip()
            return str(vals[0]).strip() if vals else ""
          description = text(DCT.description) or text(RDFS.comment)
          description_html = f'<p class="description">{h.escape(description)}</p>' if description else ""

          # Source repository: this branch on GitHub
          gh_repo = f'{os.environ.get("GITHUB_SERVER_URL", "https://github.com")}/{os.environ["GITHUB_REPOSITORY"]}'
          gh_branch = os.environ["BRANCH"]
          gh_tree = f"{gh_repo}/tree/{quote(gh_branch, safe='/')}"
          gh_file = f"{gh_repo}/blob/{quote(gh_branch, safe='/')}/{os.environ['ONTO_FILE']}"
          base = os.environ["PUBLIC_BASE_URL"]
          abbrev = os.environ["ONTO_ABBREV"]
          vers_url = f"{base}versions/{version}/{abbrev}"
          ttl  = vers_url + ".ttl"

          with open(os.environ["GITHUB_ENV"], "a") as f:
            f.write(f"GITHUB_ONTO_URI={ttl}\n")
            f.write(f"ONTO_IRI={iri}\n")
            
          jsonld = vers_url + ".jsonld"
          nt = vers_url + ".nt"
          owl = vers_url + ".owl"
          ontospy_url = base + "docs/ontospy/"
          pylode_url  = base + "docs/pylode/"
          foops_url   = base + "foops/"
          foops_item  = f'<li><a href="{foops_url}">FOOPS! detailed report</a></li>' if os.environ.get("FOOPS_REPORT", "true") == "true" else ""

          # build sorted list of all committed versions
          import re
          version_dir = os.environ["VERSION_DIR"]
          all_versions = []
          if os.path.isdir(version_dir):
            for d in os.listdir(version_dir):
              if d != "latest" and os.path.isdir(os.path.join(version_dir, d)):
                all_versions.append(d)
          def semver_key(v):
            m = re.match(r'^(\d+)\.(\d+)\.(\d+)$', v)
            return tuple(map(int, m.groups())) if m else (0, 0, 0)
          all_versions.sort(key=semver_key, reverse=True)
          version_rows = ""
          for v in all_versions:
            v_url = f"{base}versions/{v}/{abbrev}"
            current = " <strong>(current)</strong>" if v == version else ""
            version_rows += f'<li><a href="{v_url}.ttl">{v}</a> — <a href="{v_url}.ttl">ttl</a> | <a href="{v_url}.jsonld">jsonld</a> | <a href="{v_url}.nt">nt</a> | <a href="{v_url}.owl">owl</a>{current}</li>\n                  '

          # badge URLs (shields endpoint -> gist JSON files)
          bbase = os.environ["BADGE_BASE"]
          sb = os.environ["SAFE_BRANCH"]
          badges = {
            "profile": f"{bbase}ontology-ci-profile-{sb}.json",
            "reason":  f"{bbase}ontology-ci-reason-{sb}.json",
            "version": f"{bbase}ontology-ci-version-{sb}.json",
            "ontospy": f"{bbase}ontology-ci-ontospy-{sb}.json",
            "pylode":  f"{bbase}ontology-ci-pylode-{sb}.json",
            "deploy":  f"{bbase}ontology-ci-deploy-{sb}.json",
            "foops":   f"{bbase}ontology-ci-foops-{sb}.json",
          }
          html = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>{h.escape(label or abbrev)} — {version} ({sb})</title>
            <style>
              body {{ font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; margin: 2rem; line-height: 1.5; }}
              header h1 {{ margin: 0 0 .25rem 0; }}
              .description {{ max-width: 900px; margin: .25rem 0 1rem 0; font-size: 1.05rem; }}
              .meta {{ color: #555; margin-bottom: 1rem; }}
              .badges img {{ margin-right: .5rem; vertical-align: middle; }}
              .grid {{ display: grid; grid-template-columns: 1fr; gap: 1rem; max-width: 900px; }}
              .card {{ border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem; }}
              code, a {{ color: #0b5fff; word-break: break-all; }}
              ul {{ margin: .25rem 0 .5rem 1.25rem; }}
            </style>
          </head>
          <body>
            <header>
              <h1>{h.escape(label or abbrev)}</h1>
              {description_html}
              <div class="meta">
                <div><strong>Ontology IRI:</strong> <code>{iri}</code></div>
                <div><strong>Source:</strong> <a href="{gh_tree}">{os.environ["GITHUB_REPOSITORY"]} (branch <code>{h.escape(gh_branch)}</code>)</a> · <a href="{gh_file}">{os.environ['ONTO_FILE']}</a></div>
                <div><strong>Version:</strong> <code>{version}</code></div>
                <div><strong>Modified:</strong> <code>{modified}</code></div>
                <div><strong>Base URL:</strong> <a href="{base}">{base}</a></div>
              </div>
              <div class="badges">
                <img alt="Profile" src="{badges['profile']}" />
                <img alt="Reason"  src="{badges['reason']}" />
                <img alt="Version" src="{badges['version']}" />
                <img alt="Ontospy" src="{badges['ontospy']}" />
                <img alt="Pylode"  src="{badges['pylode']}" />
                <img alt="Deploy"  src="{badges['deploy']}" />
                <img alt="FOOPS"   src="{badges['foops']}" />
              </div>
            </header>

            <div class="grid">
              <section class="card">
                <h2>Downloads (version {version})</h2>
                <ul>
                  <li><a href="{ttl}">{abbrev}.ttl</a></li>
                  <li><a href="{jsonld}">{abbrev}.jsonld</a></li>
                  <li><a href="{nt}">{abbrev}.nt</a></li>
                  <li><a href="{owl}">{abbrev}.owl</a></li>
                </ul>
              </section>

              <section class="card">
                <h2>Documentation</h2>
                <ul>
                  <li><a href="{pylode_url}">PyLODE</a></li>
                  <li><a href="{ontospy_url}">Ontospy</a></li>
                  {foops_item}
                </ul>
              </section>

              <section class="card">
                <h2>All Versions</h2>
                <ul>
                  {version_rows}
                </ul>
              </section>
            </div>
          </body>
          </html>
          """
          outdir = os.environ["DOCS_DIR"]
          os.makedirs(outdir, exist_ok=True)
          with open(os.path.join(outdir, "index.html"), "w", encoding="utf-8") as f:
            f.write(html)
          PY

      # Pages is served from the gh-pages branch (branch.yml publishes each
      # branch into its own subfolder), so main publishes into gh-pages/main.
      # keep_files preserves pages generated there by earlier branch-CI runs.
      - name: Deploy to gh-pages (main/)
        id: ghpages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.DOCS_DIR }}
          destination_dir: main
          keep_files: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Badge — Deploy (Shields endpoint)
        if: always()
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ env.GIST_ID }}
          filename: ontology-ci-deploy-main.json
          label: deploy
          message: ${{ steps.ghpages.outcome }}
          color: ${{ steps.ghpages.outcome == 'success' && 'brightgreen' || steps.ghpages.outcome == 'cancelled' && 'yellow' || 'red' }}

    outputs:
      onto_iri: ${{ steps.vars.outputs.onto_iri }}

  foops:
    runs-on: ubuntu-latest
    needs: build
    env:
      GIST_ID: ${{ vars.GIST_ID }}
      ONTO_URI: ${{ needs.build.outputs.onto_iri }}

    steps:
      - name: Call FOOPS! API
        id: foops
        run: |
          if [ -z "$ONTO_URI" ]; then
            echo "::error::ONTO_URI is empty — could not derive ontology IRI from build job."
            exit 1
          fi
          curl -X POST "https://foops.linkeddata.es/assessOntology" \
              -H "accept: application/json" \
              -H "Content-Type: application/json" \
              -d "{\"ontologyUri\": \"$ONTO_URI\"}" \
              -o foops-results.json

      - name: Upload foops results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foops-results
          path: foops-results.json

      - name: Process FOOPS! results
        run: |
          python3 - << 'PY'
          import json, os
          total_score = 0
          with open('foops-results.json') as f:
            data = json.load(f)
            tot_checks = len(data["checks"])
            for check in data["checks"]:
              total_score += check["total_passed_tests"] / check["total_tests_run"]
            overall_score = total_score / tot_checks * 100
            label = f"{overall_score:.1f}% ({total_score:.2f} in {tot_checks} tests)"
            with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"FOOPS_SCORE={label}\n")
          PY

      - name: Badge — FOOPS
        if: always()
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ env.GIST_ID }}
          filename: ontology-ci-foops-main.json
          label: FOOPS!
          message: ${{ env.FOOPS_SCORE }}
          color: ${{ steps.foops.outcome == 'success' && 'brightgreen' || steps.foops.outcome == 'cancelled' && 'yellow' || 'red' }}
