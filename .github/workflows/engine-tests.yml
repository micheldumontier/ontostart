name: engine tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "apache/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/engine-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "apache/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Unit tests
        run: uv run pytest -q

      - name: Redirect tests (Apache in Docker)
        run: bash apache/test-redirects.sh
